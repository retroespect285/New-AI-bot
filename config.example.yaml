# Copy this file to config.yaml and adjust it.  Every key is optional (defaults shown).
# Unknown keys are rejected, so typos are caught at start-up.
# Defaults are set up for GOLD (XAUUSD) on MetaTrader 5.

mt5:
  # Leave login/password/server empty to use the account the MT5 terminal is already logged in to,
  # or put them in a .env file (MT5_LOGIN, MT5_PASSWORD, MT5_SERVER, MT5_PATH) - never commit passwords.
  path: null                 # e.g. "C:/Program Files/MetaTrader 5/terminal64.exe"
  login: null
  password: null
  server: null
  timeout_ms: 60000
  allow_live_account: false  # SAFETY: the bot refuses to trade a real-money account unless true

trading:
  symbols: [XAUUSD]          # exact name from MT5 Market Watch: XAUUSD, GOLD, XAUUSD.m, XAUUSDm ...
  timeframe: M5              # the bot decides once per closed candle: M5 = every 5 minutes
  magic: 285001              # tags this bot's orders so it never touches your manual trades
  dry_run: false             # true = log what it would do, never send orders
  poll_seconds: 5
  lookback_bars: 1500        # M5 candles used each cycle (other charts are fetched to cover the same time)
  warmup_bars: 20000         # history studied at start-up (~70 trading days of M5, plus M1/M30/H1/H4)
  deviation_points: 30       # max slippage accepted on market orders (gold: 30 points = $0.30)
  comment: ai-bot
  session:                   # broker *server* time; new trades only inside this window
    start_hour: 1            # skips the daily roll-over hour when gold spreads explode
    end_hour: 23
  friday_cutoff_hour: 20     # no new trades and flatten open ones after this hour on Friday (null = off)
  stale_bar_tolerance: 3
  save_models_every: 12      # the brain file is saved every N candles (1 hour on M5) and on exit
  commission_per_lot: 0.0    # round-turn commission per lot, if your account charges one
  news_file: null            # e.g. data/news.csv - no new trades around high-impact news (see README)
  news_minutes_before: 15
  news_minutes_after: 15

model:
  atr_period: 14
  # Charts the bot reads besides the M5 chart it trades on.
  context_timeframes: [M1, M30, H1, H4]
  context_bars: 600
  # Direction forecasts made every 5 minutes and scored later: "higher in 5 min / 30 min / 1 h / 4 h?"
  outlooks: [M5, M30, H1, H4]
  # Trade styles the bot chooses from (each as BUY or SELL). Stop-loss / take-profit are multiples of
  # the ATR of the style's chart; max_hold_bars is in M5 candles (12 = 1 hour).
  styles:
    - {timeframe: M5,  sl_atr: 1.5, tp_atr: 2.0, max_hold_bars: 12}    # scalp, up to 1 hour
    - {timeframe: M30, sl_atr: 1.0, tp_atr: 1.5, max_hold_bars: 48}    # intraday, up to 4 hours
    - {timeframe: H1,  sl_atr: 1.0, tp_atr: 2.0, max_hold_bars: 96}    # intraday swing, up to 8 hours
    # Optional: trades sized on the H4 chart, held up to 24 hours. Its results arrive a day late and
    # overlap heavily, so it learns poorly (tested); H4 is read for every decision either way.
    # - {timeframe: H4, sl_atr: 1.0, tp_atr: 1.5, max_hold_bars: 288}
  min_train_samples: 1500    # samples learned before a setup may trade
  min_eval_samples: 1000     # out-of-sample forecasts scored before the skill score is trusted
  min_skill: 0.005           # must beat the base rate by this much (log-loss skill score)
  min_ev_r: 0.10             # minimum expected value per trade, in R (1R = the money risked)
  min_prob: 0.0              # optional floor on the take-profit probability
  # Paper trading gate: every signal is also traded on paper; a setup trades for real only while
  # its last `paper_window` trades are profitable on average (with t-statistic >= min_paper_tstat)
  paper_window: 40
  min_paper_trades: 20
  min_paper_avg_r: 0.0
  min_paper_tstat: 1.5
  loss_decay: 0.995          # memory of the model weights (~200 samples)
  skill_decay: 0.999         # memory of the skill score (~1000 samples)
  hedge_eta: 0.3            # how sharply the experts' weights follow recent accuracy
  logit_lr: 0.002
  logit_l2: 0.0001
  scaler_span: 3000
  gbm_enabled: true
  gbm_window: 3000           # gradient boosting is re-trained on the most recent N samples...
  gbm_refit_every: 288       # ...every N new samples (288 x M5 = once a day)
  gbm_max_iter: 100
  gbm_learning_rate: 0.05
  gbm_max_depth: 3
  gbm_min_samples_leaf: 40
  gbm_max_features: 0.5
  n_threads: 1
  outcome_alpha: 0.01
  slippage_points: 3.0       # extra cost assumed per trade when learning (gold: $0.03)
  backup_days: 7             # daily copies of the brain kept in state/backups
  seed: 7

risk:
  risk_per_trade_pct: 0.5    # % of equity lost if a stop-loss is hit
  max_positions_per_symbol: 1
  max_total_positions: 3
  max_daily_loss_pct: 3.0    # stop opening trades for the rest of the (server) day
  max_drawdown_pct: 15.0     # kill switch from the equity peak; delete state/bot_state.json to reset
  max_spread_sl_fraction: 0.25
  max_spread_points: null    # e.g. 60 for gold = never trade when the spread is above $0.60
  max_consecutive_losses: 4
  cooldown_minutes: 60
  adaptive_window: 10        # risk is scaled down after a run of losses and recovers with wins
  min_risk_multiplier: 0.25
  max_lots: 5.0
  breakeven_at_r: null       # e.g. 1.0 = move the stop to entry once the trade is +1R

readiness:                   # what `python -m tradebot readiness` requires before saying "go live"
  min_days: 14
  min_trades: 30
  min_profit_factor: 1.2
  min_avg_r: 0.0
  max_drawdown_pct: 10.0

backtest:
  initial_balance: 10000
  default_spread_points: 25  # used when the data has no spread column
  warmup_bars: 6000          # bars used only for learning before the backtest starts trading
  symbol_info: {}            # contract specs when no <file>.json is next to the CSV, e.g.
  #  XAUUSD: {point: 0.01, digits: 2, tick_size: 0.01, tick_value: 1.0, contract_size: 100}

paths:
  state_dir: state           # the brain files + risk state (the bot resumes from here after a restart)
  log_dir: logs              # bot.log + CSV journals (decisions, orders, closed trades, events)
